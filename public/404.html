<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Vewr Health</title>
    <script>
      // SPA redirect: encode the path into the query string and redirect to index.html
      // index.html then reads it back and replaces the URL via history.replaceState
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + l.pathname.split('/').slice(0, 1).join('/') +
        '/?p=' + encodeURIComponent(l.pathname + l.search) + '&q=' + (l.hash || '')
      );
    </script>
  </head>
  <body></body>
</html>
